<svg xmlns="http://www.w3.org/2000/svg" width="520" height="276" viewBox="0 0 520 276" role="img" aria-label="GitHub stats terminal card, light theme">
  <title>GitHub stats</title>
  <style>
    .term-bg { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .term-bar { fill: #eaeef2; }
    .dot-red { fill: #f7615d; }
    .dot-yellow { fill: #f9c032; }
    .dot-green { fill: #40cb41; }
    .prompt { fill: #0969da; }
    .row-label { fill: #f9a859; }
    .row-dots { fill: #d0d7de; }
    .row-value { fill: #abd5ff; }
    .label-sep { fill: #24292f; }
    .loc-add { fill: #1a7f37; }
    .loc-del { fill: #cf222e; }
    .term-title { fill: #57606a; font-size: 12px; }
    text { font-family: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, "Liberation Mono", "Courier New", monospace; font-size: 13px; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .cursor-block { fill: #0969da; animation: blink 1.1s steps(1, end) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .cursor-block { animation: none; opacity: 1; }
    }
  </style>

  <rect class="term-bg" x="0.5" y="0.5" width="519" height="275" rx="6"/>

  <rect class="term-bar" x="0.5" y="0.5" width="519" height="28" rx="6"/>
  <rect class="term-bar" x="0.5" y="16.5" width="519" height="12.5"/>
  <circle class="dot-red" cx="20" cy="14.5" r="5"/>
  <circle class="dot-yellow" cx="36" cy="14.5" r="5"/>
  <circle class="dot-green" cx="52" cy="14.5" r="5"/>
  <text class="term-title" x="260" y="18.5" text-anchor="middle">Terminal</text>

  <text x="20" y="47" xml:space="preserve"><tspan class="prompt">josias.almeida@github:~$ stats --user</tspan></text>

  <text id="row-project" x="20" y="80" xml:space="preserve"><tspan class="row-label">Current</tspan><tspan class="label-sep">.</tspan><tspan class="row-label">project</tspan><tspan class="label-sep">:</tspan><tspan class="row-dots"> ................................... </tspan><tspan class="row-value">Mapstation</tspan></text>
  <text id="row-uptime" x="20" y="105" xml:space="preserve"><tspan class="row-label">Uptime</tspan><tspan class="label-sep">:</tspan><tspan class="row-dots"> ........................... </tspan><tspan class="row-value">4 years, 10 months, 19 days</tspan></text>
  <text id="row-repos" x="20" y="130" xml:space="preserve"><tspan class="row-label">Repositories</tspan><tspan class="label-sep">:</tspan><tspan class="row-dots"> ............................................... </tspan><tspan class="row-value">8</tspan></text>
  <text id="row-contributed" x="20" y="155" xml:space="preserve"><tspan class="row-label">Contributed</tspan><tspan class="label-sep">.</tspan><tspan class="row-label">to</tspan><tspan class="label-sep">:</tspan><tspan class="row-dots"> ............................................. </tspan><tspan class="row-value">0</tspan></text>
  <text id="row-stars" x="20" y="180" xml:space="preserve"><tspan class="row-label">Stars</tspan><tspan class="label-sep">:</tspan><tspan class="row-dots"> ...................................................... </tspan><tspan class="row-value">0</tspan></text>
  <text id="row-commits" x="20" y="205" xml:space="preserve"><tspan class="row-label">Commits</tspan><tspan class="label-sep">:</tspan><tspan class="row-dots"> .................................................. </tspan><tspan class="row-value">169</tspan></text>
  <text id="row-loc" x="20" y="230" xml:space="preserve"><tspan class="row-label">Lines</tspan><tspan class="label-sep">.</tspan><tspan class="row-label">of</tspan><tspan class="label-sep">.</tspan><tspan class="row-label">code</tspan><tspan class="label-sep">:</tspan><tspan class="row-dots"> ................... </tspan><tspan class="row-value">677,570 (</tspan><tspan class="loc-add">683,783++</tspan><tspan class="row-value">, </tspan><tspan class="loc-del">6,213--</tspan><tspan class="row-value">)</tspan></text>

  <text x="20" y="257" xml:space="preserve"><tspan class="prompt">$ </tspan><tspan class="cursor-block">█</tspan></text>
</svg>