name: Update profile stats

on:
  schedule:
    # A non-round minute -- the Actions queue backs up around :00 and :30.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force_cache:
        description: "Ignore the cache and recount every repository"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install -r requirements.txt

      - name: Generate stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
          BIRTHDAY: ${{ vars.BIRTHDAY }}
          CURRENT_PROJECT: ${{ vars.CURRENT_PROJECT }}
        run: |
          if [ "${{ github.event.inputs.force_cache }}" = "true" ]; then
            python today.py --force-cache
          else
            python today.py
          fi

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add light_mode.svg dark_mode.svg cache/
          git diff --staged --quiet || git commit -m "Update profile stats"
          git push
